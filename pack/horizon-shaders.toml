values = ["Lottes", "ACES Fit", "Hejl 2015", "Uncharted 2", "Tech", "Reinhard-Jodie"]
default = "Lottes"

[[options]]
id = "grade_brightness"
name = "Brightness"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "grade_contrast"
name = "Contrast"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "grade_saturation"
name = "Saturation"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "grade_vibrance"
name = "Colour Vibrance"
type = "float"
default = 0.0
min = -0.5
max = 0.5
step = 0.01
description = "Selective saturation trim around teal/orange/green; 0 matches Photon default."

[[options]]
id = "purkinje_shift"
name = "Purkinje Shift"
type = "bool"
default = true
description = "Blue-shifted night vision."

[[options]]
id = "vignette_intensity"
name = "Vignette Intensity"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05
description = "0: vignette off."

[[options]]
id = "dof"
name = "Depth of Field"
type = "bool"
default = false
description = "Bokeh focus blur around center-screen distance."

[[options]]
id = "dof_intensity"
name = "DoF Intensity"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05
description = "Strength of Depth of Field blur."

[[options]]
id = "taa"
name = "Temporal AA (TAA)"
type = "bool"
default = false
description = "Camera-reprojected TAA; moving mobs can ghost without object motion vectors."

[[options]]
id = "motion_blur"
name = "Motion Blur"
type = "bool"
default = false

[[options]]
id = "fxaa"
name = "FXAA"
type = "bool"
default = true

[[options]]
id = "cas_intensity"
name = "Sharpening (CAS)"
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05
