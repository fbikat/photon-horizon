schema = 1
id = "photon"
name = "Photon"
version = "2.0.0"
api = "0.2"
description = "Photon Shaders by SixthSurge, ported to Horizon's shader API: atmosphere, moon phases, End black hole, multi-layer volumetric clouds, cloud shadows, aurora, rainbows, SSRT & RT shadows, colored block lighting, puddles, caustics, 5-level bloom, optional DoF & TAA."
authors = ["SixthSurge (Photon)", "fbikat (Horizon port)"]
license = "LicenseRef-Photon-Shaders"
shared = ["options.wgsl", "common.wgsl"]

[frame]
fog = "pack"

[sky]
file = "sky.wgsl"
files = ["dim_sky.wgsl"]
name = "Photon sky"
sun = false
moon = false
stars = false
clouds = false

[material]
file = "material.wgsl"
files = ["lighting.wgsl", "dim_sky.wgsl"]
name = "Photon lighting"
reads = ["cloud_shadow_tex"]

[entity]
file = "entity.wgsl"
files = ["lighting.wgsl"]
name = "Photon entity lighting"
reads = ["cloud_shadow_tex"]

[vertex]
file = "vertex.wgsl"

[weather]
file = "weather.wgsl"

[shadow]
resolution = 2048
distance = 128.0
option = "shadows"
resolution_option = "shadow_resolution"
distance_option = "shadow_distance"

[ray_tracing]

[[resource]]
name = "exposure_tex"
format = "r32float"
size = [1, 1]
keep = "view"

[[resource]]
name = "cloud_shadow_tex"
format = "rgba16float"
size = [256, 256]
keep = "view"

[[resource]]
name = "clouds_tex"
format = "rgba16float"
scale = 0.5
keep = "view"

[[resource]]
name = "taa_hist"
format = "rgba16float"
scale = 1.0
keep = "view"

[[resource]]
name = "bloom_3"
format = "rgba16float"
size = [480, 270]
keep = "view"

[[resource]]
name = "bloom_4"
format = "rgba16float"
size = [240, 135]
keep = "view"

[[resource]]
name = "bloom_5"
format = "rgba16float"
size = [120, 68]
keep = "view"

[[resource]]
name = "bloom_up"
format = "rgba16float"
size = [480, 270]
keep = "view"

[[before_world]]
file = "before/cloud_shadows.wgsl"
files = ["post/clouds_density.wgsl"]
name = "Cloud shadows"
dispatch = [256, 256, 1]
workgroup = [8, 8, 1]
writes = ["cloud_shadow_tex"]

[[post]]
file = "post/clouds.wgsl"
files = ["post/clouds_density.wgsl"]
name = "Clouds"
output = "clouds_tex"
reads = ["clouds_tex_previous", "cloud_shadow_tex"]

[[post]]
file = "post/vl.wgsl"
name = "Volumetric light"
output = "vl_tex"
scale = 0.5
reads = ["cloud_shadow_tex"]

[[post]]
file = "post/composite.wgsl"
files = ["dim_sky.wgsl"]
name = "Clouds, fog, SSRT and light shafts"
reads = ["clouds_tex"]

[[post]]
file = "post/dof.wgsl"
name = "Depth of field"

[[post]]
compute = true
file = "post/taa.wgsl"
name = "Temporal AA"
dispatch = "pixels"
workgroup = [8, 8, 1]
reads = ["taa_hist_previous"]
writes = ["taa_hist"]

[[post]]
file = "post/bloom_down.wgsl"
name = "Bloom downsample 1"
output = "bloom_a"
scale = 0.5
reads = ["taa_hist"]

[[post]]
file = "post/bloom_down2.wgsl"
name = "Bloom downsample 2"
output = "bloom_b"
scale = 0.25

[[post]]
compute = true
file = "post/bloom_mip3.wgsl"
name = "Bloom downsample 3"
dispatch = [480, 270, 1]
workgroup = [8, 8, 1]
writes = ["bloom_3"]

[[post]]
compute = true
file = "post/bloom_mip4.wgsl"
name = "Bloom downsample 4"
dispatch = [240, 135, 1]
workgroup = [8, 8, 1]
reads = ["bloom_3"]
writes = ["bloom_4"]

[[post]]
compute = true
file = "post/bloom_mip5.wgsl"
name = "Bloom downsample 5"
dispatch = [120, 68, 1]
workgroup = [8, 8, 1]
reads = ["bloom_4"]
writes = ["bloom_5"]

[[post]]
compute = true
file = "post/bloom_up.wgsl"
name = "Bloom upsample"
dispatch = [480, 270, 1]
workgroup = [8, 8, 1]
reads = ["bloom_3", "bloom_4", "bloom_5"]
writes = ["bloom_up"]

[[post]]
file = "post/exposure.wgsl"
name = "Auto exposure"
output = "exposure_tex"
reads = ["exposure_tex_previous", "taa_hist"]

[[post]]
file = "post/grade.wgsl"
name = "Colour grading"
reads = ["exposure_tex", "taa_hist", "bloom_up"]

[[post]]
file = "post/motion_blur.wgsl"
name = "Motion blur"

[[post]]
file = "post/fxaa.wgsl"
name = "FXAA"

[[post]]
file = "post/final.wgsl"
name = "EASU & CAS"

[tonemap]
file = "tonemap.wgsl"
name = "Photon tonemap"

[budget]
gpu_ms = 6.0

[[materials]]
id = 3
sprites = ["block/tall_grass_bottom", "block/large_fern_bottom", "block/sunflower_bottom", "block/lilac_bottom", "block/rose_bush_bottom", "block/peony_bottom", "block/pitcher_plant_bottom", "block/tall_seagrass_bottom"]

