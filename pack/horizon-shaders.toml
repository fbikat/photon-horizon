schema = 1
id = "photon"
name = "Photon"
version = "2.0.0"
api = "0.2"
description = "Photon Shaders v1.4 by SixthSurge, ported to Horizon's shader API: Photon's atmosphere, volumetric clouds, soft coloured shadows, water, fog, bloom and colour grading."
authors = ["SixthSurge (Photon)", "fbikat (Horizon port)"]
license = "LicenseRef-Photon-Shaders"
shared = ["options.wgsl", "common.wgsl"]

[frame]
fog = "pack"

[sky]
file = "sky.wgsl"
files = ["dim_sky.wgsl"]
name = "Photon sky"
sun = false
stars = false
clouds = false

[material]
file = "material.wgsl"
files = ["lighting.wgsl", "dim_sky.wgsl"]
name = "Photon lighting"

[entity]
file = "entity.wgsl"
files = ["lighting.wgsl"]
name = "Photon entity lighting"

[vertex]
file = "vertex.wgsl"

[weather]
file = "weather.wgsl"

[shadow]
resolution = 2048
distance = 128.0
option = "shadows"
resolution_option = "shadow_resolution"
distance_option = "shadow_distance"

[ray_tracing]

[reflection]
option = "water_reflections"

[[resource]]
name = "exposure_tex"
format = "r32float"
size = [1, 1]
keep = "view"

[[post]]
file = "post/clouds.wgsl"
name = "Clouds"
output = "clouds_tex"
scale = 0.5

[[post]]
file = "post/clouds_history.wgsl"
name = "Clouds history"
output = "clouds_hist"
scale = 0.5

[[post]]
file = "post/composite.wgsl"
files = ["dim_sky.wgsl"]
name = "Clouds, fog and light shafts"

[[post]]
file = "post/bloom_down.wgsl"
name = "Bloom downsample 1"
output = "bloom_a"
scale = 0.5

[[post]]
file = "post/bloom_down2.wgsl"
name = "Bloom downsample 2"
output = "bloom_b"
scale = 0.25

[[post]]
file = "post/exposure.wgsl"
name = "Auto exposure"
output = "exposure_tex"
reads = ["exposure_tex_previous"]

[[post]]
file = "post/grade.wgsl"
name = "Colour grading"
reads = ["exposure_tex"]

[[post]]
file = "post/motion_blur.wgsl"
name = "Motion blur"

[[post]]
file = "post/fxaa.wgsl"
name = "FXAA"

[[post]]
file = "post/final.wgsl"
name = "CAS"

[tonemap]
file = "tonemap.wgsl"
name = "Photon tonemap"

[budget]
gpu_ms = 6.0

[[materials]]
id = 3
sprites = ["block/tall_grass_bottom", "block/large_fern_bottom", "block/sunflower_bottom", "block/lilac_bottom", "block/rose_bush_bottom", "block/peony_bottom", "block/pitcher_plant_bottom", "block/tall_seagrass_bottom"]

[[materials]]
id = 4
sprites = ["block/tall_grass_top", "block/large_fern_top", "block/sunflower_top", "block/lilac_top", "block/rose_bush_top", "block/peony_top", "block/pitcher_plant_top", "block/tall_seagrass_top"]

[[materials]]
id = 2
sprites = ["block/short_grass", "block/fern", "block/dandelion", "block/poppy", "block/blue_orchid", "block/allium", "block/azure_bluet", "block/*_tulip", "block/oxeye_daisy", "block/cornflower", "block/lily_of_the_valley", "block/wither_rose", "block/torchflower", "block/*_sapling", "block/wheat_stage*", "block/carrots_stage*", "block/potatoes_stage*", "block/beetroots_stage*", "block/sweet_berry_bush_stage*", "block/dead_bush", "block/bush", "block/short_dry_grass", "block/tall_dry_grass", "block/firefly_bush", "block/open_eyeblossom", "block/closed_eyeblossom", "block/pink_petals", "block/wildflowers", "block/seagrass", "block/nether_sprouts", "block/crimson_roots", "block/warped_roots"]

[[materials]]
id = 5
sprites = ["block/*_leaves", "block/azalea_leaves", "block/flowering_azalea_leaves"]

[[materials]]
id = 6
sprites = ["block/vine", "block/glow_lichen", "block/sugar_cane", "block/lily_pad", "block/cave_vines*", "block/weeping_vines*", "block/twisting_vines*", "block/hanging_roots", "block/kelp*", "block/moss_carpet", "block/pale_hanging_moss*"]

[[textures]]
id = "scattering"
file = "textures/scattering.png"
filter = "linear"
wrap = "clamp"

[[textures]]
id = "noisetex"
file = "textures/noise.png"
filter = "linear"
wrap = "repeat"

[[textures]]
id = "worley"
file = "textures/worley.png"
filter = "linear"
wrap = "clamp"

[[textures]]
id = "galaxy_tex"
file = "textures/galaxy.png"
filter = "linear"
wrap = "repeat"

[[pages]]
id = "main"
name = "Photon"
columns = 1
items = ["page:lighting", "page:shadows", "page:sky", "page:clouds", "page:fog", "page:water", "page:post"]

[[pages]]
id = "lighting"
name = "Lighting"
description = "Sun, sky, block light and foliage."
items = ["sun_i", "moon_i", "skylight_i", "blocklight_i", "blocklight_r", "blocklight_g", "blocklight_b", "emission_strength", "shading_strength", "sss_intensity", "bounced_light_i", "cave_lighting_i", "specular_highlights", "rt_reflections", "ssao", "ao_intensity", "waving_plants", "waving_leaves"]

[[pages]]
id = "shadows"
name = "Shadows"
description = "The sun and moon shadow map."
items = ["shadows", "shadow_resolution", "shadow_distance", "shadow_vps", "colored_shadows", "shadow_penumbra_scale", "shadow_pcf_steps", "rt_contact_shadows"]

[[pages]]
id = "sky"
name = "Sky"
description = "Atmosphere, sun and stars."
items = ["sun_angular_radius", "stars_intensity", "stars_coverage", "galaxy", "galaxy_intensity", "atmosphere_saturation_boost"]

[[pages]]
id = "clouds"
name = "Clouds"
description = "Volumetric clouds."
items = ["clouds_cumulus", "clouds_quality", "clouds_cumulus_coverage", "clouds_cumulus_density", "clouds_cumulus_altitude", "clouds_wind_speed", "clouds_cirrus", "clouds_cirrus_coverage"]

[[pages]]
id = "fog"
name = "Fog"
description = "Air fog and light shafts."
items = ["vl", "vl_intensity", "air_fog_density", "border_fog"]

[[pages]]
id = "water"
name = "Water"
description = "Waves, colour and reflections."
items = ["water_wave_strength", "water_absorption", "water_texture", "water_reflections"]

[[pages]]
id = "post"
name = "Post-Processing"
description = "Bloom, colour grading and anti-aliasing."
items = ["bloom", "bloom_intensity", "auto_exposure", "manual_exposure", "tonemap_operator", "grade_brightness", "grade_contrast", "grade_saturation", "grade_orange_sat_boost", "grade_teal_sat_boost", "grade_green_sat_boost", "purkinje_shift", "vignette_intensity", "motion_blur", "fxaa", "cas_intensity"]

