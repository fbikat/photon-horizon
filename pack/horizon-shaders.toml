schema = 1
id = "photon"
name = "Photon"
version = "2.0.0"
api = "0.2"
description = "Photon Shaders by SixthSurge, ported to Horizon's shader API: atmosphere, moon phases, End black hole, multi-layer volumetric clouds, cloud shadows, aurora, rainbows, SSRT & RT shadows, colored block lighting, puddles, caustics, 5-level bloom, optional DoF."
authors = ["SixthSurge (Photon)", "fbikat (Horizon port)"]
license = "LicenseRef-Photon-Shaders"
shared = ["options.wgsl", "common.wgsl"]

[frame]
fog = "pack"

[sky]
file = "sky.wgsl"
files = ["dim_sky.wgsl"]
name = "Photon sky"
sun = false
moon = false
stars = false
clouds = false

[material]
file = "material.wgsl"
files = ["lighting.wgsl", "dim_sky.wgsl", "post/clouds_buffer.wgsl"]
name = "Photon lighting"
reads = ["cloud_shadow_tex", "clouds_hist_previous", "vlao_tex_previous"]

[entity]
file = "entity.wgsl"
files = ["lighting.wgsl"]
name = "Photon entity lighting"
reads = ["cloud_shadow_tex"]

[vertex]
file = "vertex.wgsl"

[weather]
file = "weather.wgsl"

[shadow]
resolution = 2048
distance = 128.0
option = "shadows"
resolution_option = "shadow_resolution"
distance_option = "shadow_distance"

[ray_tracing]

# Kept resources (8 of 8). The auto exposure lives in bloom_5's spare column (EXPOSURE_TEXEL).
[[resource]]
name = "cloud_shadow_tex"
format = "rgba16float"
size = [512, 512]
keep = "view"

# one cloud ray per 4x4 pixels a frame (a 16-frame checkerboard), packed (post/clouds_buffer.wgsl)
[[resource]]
name = "clouds_raw"
format = "rgba32uint"
scale = 0.25
keep = "view"

# the temporally resolved clouds
[[resource]]
name = "clouds_hist"
format = "rgba32uint"
scale = 0.5
keep = "view"

# half-res light shafts and AO with their history
[[resource]]
name = "vlao_tex"
format = "rgba16float"
scale = 0.5
keep = "view"

[[resource]]
name = "bloom_3"
format = "rgba16float"
size = [480, 270]
keep = "view"

[[resource]]
name = "bloom_4"
format = "rgba16float"
size = [240, 135]
keep = "view"

[[resource]]
name = "bloom_5"
format = "rgba16float"
size = [121, 68]
keep = "view"

[[resource]]
name = "bloom_up"
format = "rgba16float"
size = [480, 270]
keep = "view"

[[before_world]]
file = "before/cloud_shadows.wgsl"
files = ["post/clouds_density.wgsl", "post/clouds_draw.wgsl"]
name = "Cloud shadows and sky map"
dispatch = [512, 512, 1]
workgroup = [8, 8, 1]
writes = ["cloud_shadow_tex"]
reads = ["cloud_shadow_tex_previous"]

[[post]]
compute = true
file = "post/clouds.wgsl"
files = ["post/clouds_density.wgsl", "post/clouds_buffer.wgsl", "post/clouds_draw.wgsl"]
name = "Clouds (1/16 checkerboard)"
dispatch = "pixels"
workgroup = [8, 8, 1]
reads = ["cloud_shadow_tex"]
writes = ["clouds_raw"]

[[post]]
compute = true
file = "post/clouds_resolve.wgsl"
files = ["post/clouds_density.wgsl", "post/clouds_buffer.wgsl"]
name = "Clouds temporal resolve"
dispatch = "pixels"
workgroup = [8, 8, 1]
reads = ["clouds_raw", "clouds_raw_previous", "clouds_hist_previous"]
writes = ["clouds_hist"]

[[post]]
file = "post/vlao.wgsl"
name = "Light shafts and AO (half res)"
output = "vlao_tex"
reads = ["vlao_tex_previous", "cloud_shadow_tex"]

[[post]]
file = "post/composite.wgsl"
files = ["dim_sky.wgsl", "post/clouds_buffer.wgsl"]
name = "Clouds, fog, SSRT and light shafts"
reads = ["clouds_hist", "vlao_tex", "cloud_shadow_tex"]

[[post]]
file = "post/bloom_down.wgsl"
name = "Bloom downsample 1"
output = "bloom_a"
scale = 0.5

[[post]]
file = "post/bloom_down2.wgsl"
name = "Bloom downsample 2"
output = "bloom_b"
scale = 0.25

[[post]]
compute = true
file = "post/bloom_mip3.wgsl"
name = "Bloom downsample 3"
dispatch = [480, 270, 1]
workgroup = [8, 8, 1]
writes = ["bloom_3"]

[[post]]
compute = true
file = "post/bloom_mip4.wgsl"
name = "Bloom downsample 4"
dispatch = [240, 135, 1]
workgroup = [8, 8, 1]
reads = ["bloom_3"]
writes = ["bloom_4"]

[[post]]
compute = true
file = "post/bloom_mip5.wgsl"
name = "Bloom downsample 5 and auto exposure"
dispatch = [128, 72, 1]
workgroup = [8, 8, 1]
reads = ["bloom_4", "bloom_5_previous"]
writes = ["bloom_5"]

[[post]]
compute = true
file = "post/bloom_up.wgsl"
name = "Bloom upsample"
dispatch = [480, 270, 1]
workgroup = [8, 8, 1]
reads = ["bloom_3", "bloom_4", "bloom_5"]
writes = ["bloom_up"]

[[post]]
file = "post/grade.wgsl"
name = "DoF, motion blur and colour grading"
reads = ["bloom_up", "bloom_5"]

# SMAA 1x's edge detection and blending weights, for the blending in the AA pass
[[post]]
file = "post/smaa_edges.wgsl"
name = "SMAA edges"
output = "smaa_edges"

[[post]]
file = "post/smaa_weights.wgsl"
name = "SMAA blending weights"
output = "smaa_weights"

[[post]]
file = "post/aa.wgsl"
name = "SMAA or FXAA"

[[post]]
file = "post/final.wgsl"
name = "EASU & CAS"

[tonemap]
file = "tonemap.wgsl"
name = "Photon tonemap"

[budget]
gpu_ms = 6.0

