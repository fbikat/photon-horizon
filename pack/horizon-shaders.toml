[[pages]]
id = "main"
name = "Photon"
columns = 1
items = ["page:lighting", "page:shadows", "page:sky", "page:clouds", "page:fog", "page:water", "page:post"]

[[pages]]
id = "lighting"
name = "Lighting"
description = "Sun, sky, block light, surfaces and foliage."
items = ["sun_i", "moon_i", "skylight_i", "blocklight_i", "blocklight_warmth", "emission_strength", "shading_strength", "sss_intensity", "bounced_light_i", "cave_lighting_i", "specular_highlights", "rt_reflections", "rain_puddles", "ssao", "ao_intensity", "waving_plants", "waving_leaves"]

[[pages]]
id = "shadows"
name = "Shadows"
description = "Sun, moon, cloud and distant shadows."
items = ["shadows", "shadow_resolution", "shadow_distance", "shadow_vps", "colored_shadows", "shadow_pcf_steps", "rt_contact_shadows", "ssrt_shadows", "cloud_shadows"]

[[pages]]
id = "sky"
name = "Sky"
description = "Atmosphere, moon, stars, aurora and rainbows."
items = ["stars_intensity", "galaxy", "galaxy_intensity", "aurora", "rainbows", "crepuscular_rays"]

[[pages]]
id = "clouds"
name = "Clouds"
description = "Volumetric and high-altitude clouds."
items = ["clouds_cumulus", "clouds_quality", "clouds_cumulus_coverage", "clouds_cumulus_density", "clouds_cirrus", "clouds_cirrus_coverage"]

[[pages]]
id = "fog"
name = "Fog"
description = "Air fog and light shafts."
items = ["vl", "vl_intensity", "air_fog_density", "border_fog"]

[[pages]]
id = "water"
name = "Water"
description = "Waves, caustics, colour and reflections."
items = ["water_wave_strength", "water_absorption", "water_texture", "water_reflections", "water_caustics"]

[[pages]]
id = "post"
name = "Post-Processing"
description = "Bloom, depth of field, colour grading and anti-aliasing."
items = ["bloom", "bloom_intensity", "auto_exposure", "manual_exposure", "tonemap_operator", "grade_brightness", "grade_contrast", "grade_saturation", "grade_vibrance", "purkinje_shift", "vignette_intensity", "dof", "dof_intensity", "taa", "motion_blur", "fxaa", "cas_intensity"]

