[[textures]]
id = "scattering"
file = "textures/scattering.png"
filter = "linear"
wrap = "clamp"

[[textures]]
id = "noisetex"
file = "textures/noise.png"
filter = "linear"
wrap = "repeat"

[[textures]]
id = "worley"
file = "textures/worley.png"
filter = "linear"
wrap = "clamp"

[[textures]]
id = "galaxy_tex"
file = "textures/galaxy.png"
