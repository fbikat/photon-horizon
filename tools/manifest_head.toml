schema = 1
id = "photon"
name = "Photon"
version = "2.0.0"
api = "0.2"
description = "Photon Shaders v1.4 by SixthSurge, ported to Horizon's shader API: Photon's atmosphere, volumetric clouds, soft coloured shadows, water, fog, bloom and colour grading."
authors = ["SixthSurge (Photon)", "fbikat (Horizon port)"]
license = "LicenseRef-Photon-Shaders"
shared = ["options.wgsl", "common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Photon sky"
sun = false
stars = false
clouds = false

[material]
file = "material.wgsl"
name = "Photon lighting"
fog = false

[vertex]
file = "vertex.wgsl"

[weather]
file = "weather.wgsl"

[shadow]
resolution = 2048
distance = 128.0
option = "shadows"
resolution_option = "shadow_resolution"
distance_option = "shadow_distance"

[reflection]
option = "water_reflections"

[[post]]
file = "post/clouds.wgsl"
name = "Clouds"
output = "clouds_tex"
scale = 0.5

[[post]]
file = "post/clouds_history.wgsl"
name = "Clouds history"
output = "clouds_hist"
scale = 0.5

[[post]]
file = "post/composite.wgsl"
name = "Clouds, fog and light shafts"

[[post]]
file = "post/bloom_down.wgsl"
name = "Bloom downsample 1"
output = "bloom_a"
scale = 0.5

[[post]]
file = "post/bloom_down2.wgsl"
name = "Bloom downsample 2"
output = "bloom_b"
scale = 0.25

[[post]]
file = "post/grade.wgsl"
name = "Colour grading"

[[post]]
file = "post/motion_blur.wgsl"
name = "Motion blur"

[[post]]
file = "post/fxaa.wgsl"
name = "FXAA"

[[post]]
file = "post/final.wgsl"
name = "CAS"

[tonemap]
file = "tonemap.wgsl"
name = "Photon tonemap"

[budget]
gpu_ms = 6.0

[[materials]]
id = 3
sprites = ["block/tall_grass_bottom", "block/large_fern_bottom", "block/sunflower_bottom", "block/lilac_bottom", "block/rose_bush_bottom", "block/peony_bottom", "block/pitcher_plant_bottom", "block/tall_seagrass_bottom"]

[[materials]]
id = 4
sprites = ["block/tall_grass_top", "block/large_fern_top", "block/sunflower_top", "block/lilac_top", "block/rose_bush_top", "block/peony_top", "block/pitcher_plant_top", "block/tall_seagrass_top"]

[[materials]]
id = 2
sprites = ["block/short_grass", "block/fern", "block/dandelion", "block/poppy", "block/blue_orchid", "block/allium", "block/azure_bluet", "block/*_tulip", "block/oxeye_daisy", "block/cornflower", "block/lily_of_the_valley", "block/wither_rose", "block/torchflower", "block/*_sapling", "block/wheat_stage*", "block/carrots_stage*", "block/potatoes_stage*", "block/beetroots_stage*", "block/sweet_berry_bush_stage*", "block/dead_bush", "block/bush", "block/short_dry_grass", "block/tall_dry_grass", "block/firefly_bush", "block/open_eyeblossom", "block/closed_eyeblossom", "block/pink_petals", "block/wildflowers", "block/seagrass", "block/nether_sprouts", "block/crimson_roots", "block/warped_roots"]

[[materials]]
id = 5
sprites = ["block/*_leaves", "block/azalea_leaves", "block/flowering_azalea_leaves"]

[[materials]]
id = 6
sprites = ["block/vine", "block/glow_lichen", "block/sugar_cane", "block/lily_pad", "block/cave_vines*", "block/weeping_vines*", "block/twisting_vines*", "block/hanging_roots", "block/kelp*", "block/moss_carpet", "block/pale_hanging_moss*"]

[[textures]]
